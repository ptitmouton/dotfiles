# set history length to 5000
set-option -g history-limit 5000

# enable mouse support
set-option -g mouse on

# clear screen on prefix C-r
# bind C-r send-keys -R \; send-keys C-l \; clear-history

# set prefix to C-a
set-option -g prefix C-a

# set delay between prefix and command
set-option -g escape-time 1

# every window has biggest possible size
setw -g aggressive-resize on

# set the bas index for windows and panes to 1 (default is 0-index)
set -g base-index 1
setw -g pane-base-index 1

# ensure sending C-a to underlying program
bind C-a send-prefix

# split window | and - directions
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# select l/r/t/d panes with vim-keys
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# change window size
bind H resize-pane -L 5
bind L resize-pane -R 5
bind J resize-pane -D 5
bind K resize-pane -U 5

# 256 colors mode
set-option -g default-terminal "screen-256color"
set-option -g terminal-overrides ',xterm-256color:RGB'

# colors
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-left-plugins "session git cpu ram"
set -g @tmux2k-right-plugins "battery network time"

# contorl refresh rate, applies to bandwidth, ping
set -g @tmux2k-refresh-rate 1


setw -g pane-border-style fg=cyan,bg=black,width=2
setw -g pane-active-border-style fg=yellow,bg=black

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on


# resurrect vim sessions
set -g @resurrect-strategy-nvim 'session'

# autostart tmux on system boot
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'ghostty'

# reload configuration
bind r source-file ~/.tmux.conf \; display "resourced config file"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-fingers'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'zuxfoucault/tmux-continuum_dev#feature/ghostty'

set -g @plugin "janoamaral/tokyo-night-tmux"

set -g @plugin '2kabhishek/tmux2k'

set -g @plugin 'tmux-plugins/tmux-pain-control'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
